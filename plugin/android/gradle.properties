org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# 项目路径含中文，跳过 AGP 的非 ASCII 路径检查
android.overridePathCheck=true
# 中文路径下 Kotlin 增量编译缓存会关闭失败，直接关掉
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# flutter_js 用 JVM 1.8，与 app 的 17 不一致；降级为警告即可（bytecode 在 Android 上由 desugar 处理）
kotlin.jvm.target.validation.mode=warning
